<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tiny-chat-ai</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 12px 16px; border-bottom: 1px solid #333; font-weight: bold; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  button.small { padding: 8px 12px; font-size: 13px; }
  button.teach { margin-top: 6px; padding: 4px 10px; font-size: 12px; background: #444; border-radius: 8px; }
  #export { position: fixed; inset: 0; background: rgba(0,0,0,.85); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #export[hidden] { display: none; }
  #export p { margin: 0; font-size: 14px; line-height: 1.5; }
  .hb { display: flex; gap: 6px; }
  #list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .row-item { display: flex; gap: 6px; align-items: flex-start; background: #1c1c1c; border: 1px solid #333; border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .row-item .body { flex: 1; line-height: 1.5; word-break: break-all; }
  .tag { display: inline-block; margin-top: 2px; padding: 1px 8px; border-radius: 8px; font-size: 11px; }
  .tag.sent { background: #234; color: #8cf; } .tag.pending { background: #432; color: #fc8; }
  button.del { background: #a33; }
  #export .row { display: flex; gap: 8px; } #export .row button { padding: 12px 16px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #2b6cff; }
  .ai { align-self: flex-start; background: #2a2a2a; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #333; }
  input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #444; background: #1c1c1c; color: #eee; font-size: 16px; }
  button { padding: 0 20px; border: 0; border-radius: 12px; background: #2b6cff; color: #fff; font-size: 16px; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header><span>tiny-chat-ai</span><span class="hb"><button id="newChat" class="small" style="background:#444">新しい会話</button><button id="openExport" class="small">教えた内容 (<span id="count">0</span>)</button></span></header>
<div id="log"></div>
<form id="form" autocomplete="off">
  <input id="input" placeholder="メッセージを入力" enterkeyhint="send">
  <button id="send" type="submit">送信</button>
</form>
<div id="export" hidden>
  <p>教えた内容の一覧です。<b>GitHubに反映</b>を押すと、未反映の分が data.txt に追記され、自動で再学習されます。</p>
  <div id="list"></div>
  <div class="row"><button id="pushGithub">GitHubに反映</button><button id="copyExport" style="background:#444">未反映をコピー</button><button id="closeExport" style="background:#444">閉じる</button></div>
  <p style="font-size:12px;color:#999">反映済みの内容を直したときは、直した版が data.txt に追記されます（古い版は残ります）。完全に消したいときは、GitHubで data.txt を直接編集してください。 <a href="#" id="resetToken" style="color:#999">保存したトークンを消す</a></p>
</div>
<script src="app.js"></script>
</body>
</html>
